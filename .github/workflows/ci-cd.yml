
name: NasBlok CI/CD

on:
  pull_request:
    branches:
      - main
      - development

  push:
    branches:
      - main

jobs:
  # ==========================================
  # 1. LINT
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint backend
        working-directory: backend
        run: ruff check .

  # ==========================================
  # 2. BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Check Python compilation
        run: python -m compileall -q backend/app backend/alembic

      - name: Package backend
        working-directory: backend
        run: |
          zip -r ../backend-package.zip \
            app \
            alembic \
            alembic.ini \
            requirements.txt \
            pyproject.toml \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip
          if-no-files-found: error

      - name: Build backend Docker image
        run: |
          docker build \
            -t nasblok-backend:${{ github.sha }} \
            ./backend

      - name: Save backend Docker image
        run: |
          docker save nasblok-backend:${{ github.sha }} \
            | gzip > backend-image.tar.gz

      - name: Upload backend Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 3. TEST
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with coverage
        working-directory: frontend
        run: |
          set -o pipefail
          node --experimental-test-coverage --test tests/*.test.mjs \
            | tee frontend-coverage.txt

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/frontend-coverage.txt
          if-no-files-found: error

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-test.txt

      - name: Test backend with coverage
        working-directory: backend
        run: |
          python -m pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            tests/

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  # ==========================================
  # 4. DEPLOY
  # ==========================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    needs: [lint, build, test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      packages: write
      deployments: write

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: Load and tag backend Docker image
        run: |
          gunzip -c backend-image.tar.gz | docker load

          docker tag \
            nasblok-backend:${{ github.sha }} \
            ghcr.io/nik003kk/nasblok-backend:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push existing Docker image to GHCR
        run: |
          docker push \
            ghcr.io/nik003kk/nasblok-backend:${{ github.sha }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy backend to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_PROJECT_ID" || {
            echo "Missing RAILWAY_PROJECT_ID"
            exit 1
          }

          railway service source connect \
            --image ghcr.io/nik003kk/nasblok-backend:${{ github.sha }} \
            --service NasBlok_backend \
            --environment production \
            --project "$RAILWAY_PROJECT_ID"

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=nasblok-frontend --branch=main
